name: "新功能建议"
description: "为 Oler debug 提出一个新功能或改进建议"
type: "Feature"
body:
- type: checkboxes
  id: "yml-1"
  attributes:
    label: "检查项"
    description: "请逐个检查下列项目，并勾选确认。"
    options:
    - label: "我已在 [Issues 页面](https://github.com/Gaozx1/aidebug/issues?q=is%3Aissue+) 中搜索，确认这一功能建议未被提交过"
      required: true
    - label: "我确认只是全部选中而没有[仔细确认](https://github.com/Gaozx1/aidebug/issues?q=is%3Aissue+)就直接提交了这个 Issue，并且同意这个 Issue 可以直接被关闭"
      required: false
    - label: "我确认会详细描述我期望的功能，并说明使用场景，而不是模糊地说'加个某某功能'"
      required: true
    - label: "我理解新功能的实现可能需要时间，愿意配合提供更多信息或参与测试"
      required: true

- type: textarea
  id: "yml-2"
  attributes:
    label: "功能描述"
    description: "清晰描述你希望添加的新功能是什么。"
    placeholder: |
      例如：希望在调试界面增加一个「变量监视器」面板，可以实时查看变量的值变化。
    validations:
      required: true

- type: textarea
  id: "yml-3"
  attributes:
    label: "使用场景"
    description: "描述你在什么情况下会用到这个功能，解决了什么痛点。"
    placeholder: |
      示例：
      1、调试循环逻辑时，需要反复查看某个变量的变化趋势
      2、当前只能通过 console.log 打印，效率较低
    validations:
      required: true

- type: dropdown
  id: "yml-4"
  attributes:
    label: "优先级期望"
    description: "你希望这个功能的紧急程度是？"
    options:
      - "高（严重阻塞当前开发流程）"
      - "中（有影响，但有临时替代方案）"
      - "低（锦上添花，可以慢慢来）"
  validations:
    required: true

- type: textarea
  id: "yml-5"
  attributes:
    label: "参考示例"
    description: "如果其他工具或项目有类似功能，可以贴链接或截图供参考。"
    placeholder: |
      先点击这个文本框，再将截图拖拽进来上传。
      例如：Chrome DevTools 的 Watch 面板、VS Code 的调试变量区等。
    validations:
      required: false

- type: textarea
  id: "yml-6"
  attributes:
    label: "补充说明"
    description: "任何其他想说的内容。"
    placeholder: |
      比如：我可以帮忙测试原型版本，或者我已经有初步的实现思路。
    validations:
      required: false